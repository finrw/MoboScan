<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Scanner Pemilihan RW016</title>
  
  <!-- Pustaka Scanner HTML5 QR Code -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: system-ui, -apple-system, sans-serif; 
      background: #000; 
      color: #fff; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      min-height: 100vh;
      overflow: hidden;
    }

    .header {
      position: absolute;
      top: 20px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 16px;
      font-weight: bold;
      text-align: center;
    }

    /* Container Kamera Scanner */
    #reader {
      width: 100vw !important;
      height: 100vh !important;
      border: none !important;
    }

    #reader video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }

    /* Sembunyikan elemen bawaan pustaka yang tidak perlu */
    #reader__dashboard_section_swaplink, 
    #reader__camera_selection {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="header">Arahkan QR Code ke Kamera</div>
  
  <!-- Container untuk Kamera -->
  <div id="reader"></div>

  <script>
    // 1. LINK GOOGLE APPS SCRIPT ANDA
    const targetUrl = "https://script.google.com/macros/s/AKfycbwhUjWJB_7_HS-ZwYygT5hmSgQGcIgtpWWim6EIb3-CpnZ4pE0Gw6O6E8oV3EbkZYTa/exec";

    // 2. FUNGSI SAAT SCAN BERHASIL
    function onScanSuccess(decodedText, decodedResult) {
        console.log("QR Terbaca:", decodedText);
        
        // Ambil nilai token jika QR berisi URL lengkap (misal: ...?token=XYZ)
        let token = decodedText;
        const match = decodedText.match(/[?&]token=([^&#\s]+)/i);
        if (match) {
            token = match[1];
        }

        // Hentikan scanner sebelum berpindah halaman
        html5QrcodeScanner.clear().then(() => {
            window.location.href = targetUrl + "?token=" + encodeURIComponent(token);
        }).catch(err => {
            window.location.href = targetUrl + "?token=" + encodeURIComponent(token);
        });
    }

    function onScanFailure(error) {
        // Abaikan error per frame saat QR belum terdeteksi
    }

    // 3. JALANKAN SCANNER OTOMATIS
    let html5QrcodeScanner = new Html5QrcodeScanner(
        "reader", 
        { 
            fps: 15, 
            qrbox: { width: 250, height: 250 },
            rememberLastUsedCamera: true
        },
        /* verbose= */ false
    );
    
    html5QrcodeScanner.render(onScanSuccess, onScanFailure);
  </script>
</body>
</html>
