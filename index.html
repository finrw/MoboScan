<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan barang</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,sans-serif;background:#f2f3f5;color:#1c1e21}
  main{max-width:480px;margin:0 auto;padding:14px}
  h1{font-size:20px;margin:4px 0 12px}
  label{display:block;font-weight:600;margin:14px 0 4px}
  input,select,textarea,button{width:100%;font:inherit;padding:11px;border:1px solid #c5c8cd;border-radius:8px;background:#fff}
  .cam{background:#000;border-radius:8px;overflow:hidden;position:relative;min-height:60px}
  #reader{width:100%}
  #flash{position:absolute;inset:0;background:rgba(76,217,100,.55);opacity:0;pointer-events:none;transition:opacity .45s}
  #flash.on{opacity:1;transition:none}
  #vid{width:100%;height:auto;display:none}
  #box{position:absolute;left:10%;top:41%;width:80%;height:18%;border:2px solid #4cd964;display:none;pointer-events:none}
  .tabs{display:flex;gap:8px;margin-bottom:8px}
  .tabs button{width:auto;flex:1;cursor:pointer}
  .tabs button.on{background:#1c1e21;color:#fff;border-color:#1c1e21}
  .row{display:flex;gap:8px}
  .row button{width:auto;cursor:pointer}
  #save{margin-top:18px;background:#1c1e21;color:#fff;font-weight:600;cursor:pointer}
  #msg{margin-top:12px;min-height:22px;font-size:14px}
  select#status{font-weight:700}
</style>
</head>
<body>
<main>
  <h1>Scan barang</h1>

  <label for="tanggal">Tanggal</label>
  <input type="date" id="tanggal">

  <label>Serial (barcode Code 128)</label>
  <div class="tabs">
    <button id="tBc" class="on" type="button">Barcode</button>
    <button id="tTx" type="button">Teks model</button>
  </div>
  <div class="cam">
    <div id="reader"></div>
    <video id="vid" playsinline muted></video>
    <div id="box"></div>
    <div id="flash"></div>
  </div>
  <div class="row" style="margin-top:8px">
    <button id="again" type="button">Scan ulang</button>
    <button id="shot" type="button" style="display:none">Ambil &amp; baca teks</button>
    <button id="torch" type="button" style="display:none">Senter: mati</button>
  </div>
  <div id="zoomWrap" style="display:none;margin-top:10px">
    <label for="zoom" style="margin:0 0 4px">Zoom (geser ke kanan untuk mendekat)</label>
    <input type="range" id="zoom" style="padding:0">
  </div>
  <div id="conWrap" style="display:none;margin-top:10px">
    <label for="con" style="margin:0 0 4px">Kontras teks (naikkan jika tempat gelap)</label>
    <input type="range" id="con" min="1" max="3" step="0.1" value="1.3" style="padding:0">
  </div>
  <input id="serial" placeholder="Serial (scan atau ketik)" autocomplete="off" style="margin-top:8px">
  <div id="info" style="margin-top:6px;font-size:14px;min-height:20px"></div>

  <label for="model">Tipe model</label>
  <input id="model" placeholder="Hasil baca teks, atau ketik manual" autocomplete="off">

  <label for="status">Status</label>
  <select id="status">
    <option value="IN">IN</option>
    <option value="OUT">OUT</option>
    <option value="OK">OK</option>
    <option value="KANIBAL">KANIBAL</option>
    <option value="BALIK RUSAK">BALIK RUSAK</option>
    <option value="RMA">RMA</option>
  </select>

  <label for="ket">Keterangan</label>
  <textarea id="ket" rows="3"></textarea>

  <label for="tglOut">Tanggal barang out</label>
  <input type="date" id="tglOut">

  <label for="tglKembali">Tanggal kembali (jika barang dikembalikan)</label>
  <input type="date" id="tglKembali">

  <button id="save" type="button">Simpan</button>
  <div id="msg"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
const EXEC_URL = 'https://script.google.com/macros/s/AKfycbzrA2XqFWmV-zYYDoOwahEhrsn_Q5PSfuKvUheinJ3IxJcrkNgWJmW3-XPWhPrREVUOEg/exec';

const $ = id => document.getElementById(id);
const COL = { 'IN':['#9e9e9e','#fff'], 'OUT':['#e53935','#fff'], 'OK':['#43a047','#fff'],
              'KANIBAL':['#fdd835','#222'], 'BALIK RUSAK':['#fb8c00','#fff'], 'RMA':['#1e88e5','#fff'] };
const today = () => new Date().toLocaleDateString('sv-SE');
const msg = (t, err) => { $('msg').textContent = t; $('msg').style.color = err ? '#c62828' : '#2e7d32'; };

// Warna dropdown status
function paint() {
  const c = COL[$('status').value];
  $('status').style.background = c[0]; $('status').style.color = c[1];
}
[...$('status').options].forEach(o => { o.style.background = COL[o.value][0]; o.style.color = COL[o.value][1]; });
let cur = null; // data serial yang ditemukan di Spreadsheet
$('status').addEventListener('change', () => {
  paint();
  const s = $('status').value;
  if (s === 'OUT') { if (!$('tglOut').value) $('tglOut').value = today(); $('tglKembali').value = ''; }
  if (s === 'IN' && cur && cur.status === 'OUT' && !$('tglKembali').value) $('tglKembali').value = today();
});

// Kamera (satu kamera, dua mode)
let qr = null, stream = null, torchOn = false;
function track() {
  const v = stream ? $('vid') : document.querySelector('#reader video');
  return v && v.srcObject ? v.srcObject.getVideoTracks()[0] : null;
}
function initTorch() {
  setTimeout(() => {
    const t = track();
    const c = t && t.getCapabilities ? t.getCapabilities() : {};
    torchOn = false; $('torch').textContent = 'Senter: mati';
    $('torch').style.display = c.torch ? '' : 'none';
    if (c.zoom) {
      $('zoom').min = c.zoom.min; $('zoom').max = c.zoom.max; $('zoom').step = c.zoom.step || 0.1;
      $('zoom').value = (t.getSettings().zoom) || c.zoom.min;
      $('zoomWrap').style.display = '';
    } else $('zoomWrap').style.display = 'none';
  }, 600);
}
$('zoom').oninput = () => {
  const t = track(); if (!t) return;
  t.applyConstraints({ advanced: [{ zoom: +$('zoom').value }] }).catch(() => {});
};
$('torch').onclick = async () => {
  const t = track(); if (!t) return;
  try {
    torchOn = !torchOn;
    await t.applyConstraints({ advanced: [{ torch: torchOn }] });
    $('torch').textContent = 'Senter: ' + (torchOn ? 'nyala' : 'mati');
  } catch (e) { torchOn = !torchOn; msg('Senter tidak didukung di perangkat ini.', true); }
};
async function stopAll() {
  torchOn = false; $('torch').style.display = 'none'; $('zoomWrap').style.display = 'none';
  if (qr) { try { await qr.stop(); } catch (e) {} try { qr.clear(); } catch (e) {} qr = null; }
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  $('vid').srcObject = null;
}
function setTab(bc) {
  $('tBc').classList.toggle('on', bc); $('tTx').classList.toggle('on', !bc);
  $('reader').style.display = bc ? 'block' : 'none';
  $('vid').style.display = $('box').style.display = bc ? 'none' : 'block';
  $('again').style.display = bc ? '' : 'none';
  $('shot').style.display = bc ? 'none' : '';
  $('conWrap').style.display = bc ? 'none' : '';
}
async function startBarcode() {
  await stopAll(); setTab(true);
  qr = new Html5Qrcode('reader', {
    formatsToSupport: [Html5QrcodeSupportedFormats.CODE_128],
    useBarCodeDetectorIfSupported: true, verbose: false });
  try {
    await qr.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 280, height: 110 } }, onCode, () => {});
    msg(''); initTorch();
  } catch (e) { msg('Kamera tidak bisa dibuka. Izinkan akses kamera, atau ketik serial manual.', true); }
}
async function startText() {
  await stopAll(); setTab(false);
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } } });
    $('vid').srcObject = stream; await $('vid').play(); msg('Arahkan teks model ke dalam kotak hijau.'); initTorch();
  } catch (e) { msg('Kamera tidak bisa dibuka. Ketik model manual.', true); }
}
$('tBc').onclick = startBarcode;
$('tTx').onclick = startText;
$('again').onclick = startBarcode;

// Beep + kilat hijau saat berhasil
let ac = null;
function unlockAudio() {
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch (e) {}
}
document.addEventListener('pointerdown', unlockAudio, { passive: true });
function beep() {
  try {
    unlockAudio();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'square'; o.frequency.value = 1800; g.gain.value = 0.15;
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + 0.15);
  } catch (e) {}
}
function flash() {
  $('flash').classList.add('on');
  setTimeout(() => $('flash').classList.remove('on'), 150);
}

// Barcode terbaca
async function onCode(text) {
  const s = text.trim();
  $('serial').value = s;
  beep(); flash();
  if (navigator.vibrate) navigator.vibrate(120);
  await stopAll();
  msg('Serial terbaca: ' + s);
  lookup(s);
}
async function lookup(s) {
  $('info').style.color = '#555'; $('info').textContent = 'Mengecek serial...';
  try {
    const r = await (await fetch(EXEC_URL + '?serial=' + encodeURIComponent(s))).json();
    if (r.found) {
      const d = r.data; cur = d;
      $('tanggal').value = d.tanggal || today(); $('model').value = d.model;
      $('status').value = d.status || 'IN'; $('ket').value = d.keterangan;
      $('tglOut').value = d.tglOut; $('tglKembali').value = d.tglKembali;
      paint();
      $('info').style.color = '#2e7d32';
      $('info').textContent = 'Ditemukan. Status sekarang: ' + d.status +
        (d.status === 'OUT' && d.tglOut ? ' (out ' + d.tglOut + ')' : '') + '. Ubah status lalu simpan.';
    } else {
      cur = null; $('info').style.color = '#e65100';
      $('info').textContent = 'Serial belum terdaftar. Status IN akan mendaftarkannya sebagai barang baru.';
    }
  } catch (e) { cur = null; $('info').style.color = '#c62828'; $('info').textContent = 'Gagal mengecek serial. Periksa koneksi.'; }
}
$('serial').addEventListener('change', () => { const s = $('serial').value.trim(); if (s) lookup(s); });

// Baca teks model (OCR)
$('shot').onclick = async () => {
  const v = $('vid');
  if (!v.videoWidth) return msg('Kamera belum siap.', true);
  msg('Membaca teks...');
  const w = v.videoWidth, h = v.videoHeight;
  const sx = w * 0.1, sy = h * 0.41, sw = w * 0.8, sh = h * 0.18;
  const cv = document.createElement('canvas');
  cv.width = sw; cv.height = sh;
  const ctx = cv.getContext('2d');
  ctx.drawImage(v, sx, sy, sw, sh, 0, 0, sw, sh);
  // hitam-putih, ratakan terang-gelap otomatis, kontras manual; dibalik jika teks lebih terang dari latar
  const im = ctx.getImageData(0, 0, sw, sh), p = im.data, n = p.length / 4, hist = new Array(256).fill(0);
  for (let i = 0; i < p.length; i += 4) { const g = Math.round(.3*p[i] + .59*p[i+1] + .11*p[i+2]); p[i] = g; hist[g]++; }
  let lo = 0, hi = 255, acc = 0;
  for (let k = 0; k < 256; k++) { acc += hist[k]; if (acc >= n * .02) { lo = k; break; } }
  acc = 0;
  for (let k = 255; k >= 0; k--) { acc += hist[k]; if (acc >= n * .02) { hi = k; break; } }
  if (hi - lo < 20) hi = lo + 20;
  const kon = +$('con').value; let sum = 0;
  for (let i = 0; i < p.length; i += 4) {
    let g = (p[i] - lo) / (hi - lo) * 255; g = (g - 128) * kon + 128; g = Math.max(0, Math.min(255, g));
    p[i] = g; sum += g;
  }
  const inv = sum / n < 128;
  for (let i = 0; i < p.length; i += 4) { const g = inv ? 255 - p[i] : p[i]; p[i] = p[i+1] = p[i+2] = g; }
  ctx.putImageData(im, 0, 0);
  try {
    const wk = await Tesseract.createWorker('eng');
    await wk.setParameters({ tessedit_pageseg_mode: '7', tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-/ .' });
    const { data } = await wk.recognize(cv);
    await wk.terminate();
    const t = data.text.trim().replace(/\s+/g, ' ');
    if (t) { $('model').value = t; beep(); flash(); msg('Hasil: ' + t + ' (periksa, bisa diedit)'); }
    else msg('Teks tidak terbaca. Coba lagi atau ketik manual.', true);
  } catch (e) { msg('Gagal membaca teks. Ketik manual.', true); }
};

// Simpan
async function doSave(force) {
  const serial = $('serial').value.trim();
  if (!serial) return msg('Serial belum diisi.', true);
  $('save').disabled = true; msg('Menyimpan...');
  const body = { tanggal: $('tanggal').value, serial, model: $('model').value.trim(),
    status: $('status').value, keterangan: $('ket').value.trim(),
    tglOut: $('tglOut').value, tglKembali: $('tglKembali').value, force: !!force };
  try {
    const r = await (await fetch(EXEC_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(body) })).json();
    if (!r.ok && (r.code === 'NOT_FOUND' || r.code === 'ALREADY_OUT')) {
      $('save').disabled = false; msg(r.error, true);
      if (confirm(r.error + '\n\nTetap simpan sebagai OUT?')) return doSave(true);
      return;
    }
    if (!r.ok) throw new Error(r.error);
    msg(r.updated ? 'Data diperbarui.' : 'Data tersimpan.');
    ['serial', 'model', 'ket', 'tglOut', 'tglKembali'].forEach(k => $(k).value = '');
    cur = null; $('info').textContent = '';
    $('status').value = 'IN'; paint(); startBarcode();
  } catch (e) { msg('Gagal menyimpan: ' + e.message, true); }
  $('save').disabled = false;
}
$('save').onclick = () => doSave(false);

$('tanggal').value = today(); paint(); startBarcode();
</script>
</body>
</html>
